name: depthscope-data
services:
  kafka:
    image: apache/kafka:4.1.2
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_MESSAGE_MAX_BYTES: 16777216
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    volumes:
    - kafka:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:9092
      - --list
      interval: 10s
      timeout: 8s
      retries: 15
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: depthscope
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-depthscope-local}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
    - clickhouse:/var/lib/clickhouse
    healthcheck:
      test:
      - CMD-SHELL
      - clickhouse-client --user depthscope --password "$$CLICKHOUSE_PASSWORD" --query
        'SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 15
  objectstore:
    image: chrislusf/seaweedfs:4.22
    command:
    - mini
    - -dir=/data
    - -ip=objectstore
    - -ip.bind=0.0.0.0
    environment:
      AWS_ACCESS_KEY_ID: depthscope
      AWS_SECRET_ACCESS_KEY: ${ARCHIVE_PASSWORD:-depthscope-local}
      S3_BUCKET: depthscope
    volumes:
    - objectstore:/data
  collector:
    image: depthscope-data-local
    restart: 'no'
    environment: &id001
      KAFKA_BOOTSTRAP: kafka:9092
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: depthscope
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-depthscope-local}
      S3_ENDPOINT: http://objectstore:8333
      ARCHIVE_BUCKET: depthscope
      AWS_ACCESS_KEY_ID: depthscope
      AWS_SECRET_ACCESS_KEY: ${ARCHIVE_PASSWORD:-depthscope-local}
      MAX_PIPELINE_LAG_SECONDS: ${MAX_PIPELINE_LAG_SECONDS:-30}
    command:
    - collector
    depends_on:
      kafka:
        condition: service_healthy
      processor:
        condition: service_started
      archiver:
        condition: service_started
      frame-store:
        condition: service_started
  processor:
    build: .
    image: depthscope-data-local
    restart: on-failure
    environment: *id001
    command:
    - process
    volumes:
    - processor:/state
    depends_on:
      kafka:
        condition: service_healthy
      objectstore:
        condition: service_started
      clickhouse:
        condition: service_healthy
  archiver:
    image: depthscope-data-local
    restart: on-failure
    environment: *id001
    command:
    - archiver
    volumes:
    - archiver:/state
    depends_on:
      kafka:
        condition: service_healthy
      objectstore:
        condition: service_started
  frame-store:
    image: depthscope-data-local
    restart: on-failure
    environment: *id001
    command:
    - store-frames
    volumes:
    - frames:/state
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
volumes:
  kafka: null
  clickhouse: null
  objectstore: null
  processor: null
  archiver: null
  frames: null
